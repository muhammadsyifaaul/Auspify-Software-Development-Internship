<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMaster WMS | Industrial Inventory Operations Cockpit</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0b0f19] text-slate-200 min-h-screen flex flex-col font-sans antialiased selection:bg-amber-500 selection:text-black">

  <!-- TOP INDUSTRIAL HUD TELEMETRY BAR -->
  <header class="bg-[#111827] border-b border-slate-800 sticky top-0 z-30 shadow-lg">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-amber-500 text-black flex items-center justify-center font-black text-sm shadow-md">
          <i class="fa-solid fa-boxes-stacked"></i>
        </div>
        <div class="flex items-center space-x-2">
          <span class="text-sm font-black tracking-wider uppercase text-white font-mono">StockMaster</span>
          <span class="text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30 px-1.5 py-0.2 rounded font-mono">WMS-OS</span>
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse ml-2"></span>
          <span class="text-[10px] text-emerald-400 font-mono hidden sm:inline">ONLINE</span>
        </div>
      </div>

      <!-- Quick Telemetry Chips -->
      <div class="hidden md:flex items-center space-x-6 text-xs font-mono">
        <div>
          <span class="text-slate-400 text-[10px] block">TOTAL VALUATION</span>
          <span id="hudValuation" class="text-amber-400 font-bold">$0.00</span>
        </div>
        <div class="h-6 w-px bg-slate-800"></div>
        <div>
          <span class="text-slate-400 text-[10px] block">ACTIVE SKUs</span>
          <span id="hudSkus" class="text-cyan-400 font-bold">0</span>
        </div>
        <div class="h-6 w-px bg-slate-800"></div>
        <div>
          <span class="text-slate-400 text-[10px] block">CRITICAL REORDER</span>
          <span id="hudLowStock" class="text-rose-400 font-bold">0 ALERTS</span>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button id="exportCsvBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-mono border border-slate-700 transition">
          <i class="fa-solid fa-file-csv mr-1 text-slate-400"></i> Export
        </button>
        <button id="openAddProductBtn" class="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs font-mono transition shadow-sm">
          <i class="fa-solid fa-plus mr-1"></i> Register SKU
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN COCKPIT WORKSPACE (SPLIT LAYOUT) -->
  <main class="max-w-[1600px] mx-auto px-4 sm:px-6 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- LEFT / CENTER: OPERATIONAL SKU INVENTORY (Col 8) -->
    <div class="lg:col-span-8 space-y-4">

      <!-- Cockpit Filter & Search Console -->
      <div class="bg-[#111827] border border-slate-800 rounded-xl p-3 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs">
        <div class="relative w-full sm:w-80">
          <i class="fa-solid fa-barcode absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
          <input type="text" id="searchInput" placeholder="Search SKU, Product, Supplier..." class="w-full pl-9 pr-4 py-1.5 rounded-lg bg-[#0b0f19] border border-slate-700 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500 font-mono text-xs">
        </div>

        <div class="flex items-center space-x-2 w-full sm:w-auto font-mono text-xs">
          <select id="categoryFilter" class="bg-[#0b0f19] border border-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg focus:outline-none">
            <option value="">All Categories</option>
            <option value="Electronics">Electronics</option>
            <option value="Computers & Accessories">Computers & Accessories</option>
            <option value="Networking">Networking</option>
            <option value="Office Supplies">Office Supplies</option>
            <option value="Audio & Video">Audio & Video</option>
          </select>

          <select id="stockFilter" class="bg-[#0b0f19] border border-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg focus:outline-none">
            <option value="">All Statuses</option>
            <option value="critical">Low / Out of Stock</option>
            <option value="normal">Adequate Stock</option>
          </select>
        </div>
      </div>

      <!-- INVENTORY MATRIX CARDS -->
      <div id="productGrid" class="space-y-3">
        <!-- Dynamically injected via JS -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-16 bg-[#111827] rounded-xl border border-dashed border-slate-800">
        <i class="fa-solid fa-box-open text-3xl text-slate-600 mb-2"></i>
        <p class="font-mono text-xs text-slate-400">NO INVENTORY DATA MATCHING PARAMETERS</p>
      </div>
    </div>

    <!-- RIGHT: LIVE WAREHOUSE TERMINAL AUDIT FEED (Col 4) -->
    <div class="lg:col-span-4 space-y-4">
      <div class="bg-[#111827] border border-slate-800 rounded-xl overflow-hidden flex flex-col h-[750px]">
        <!-- Terminal Header -->
        <div class="bg-[#0b0f19] px-4 py-3 border-b border-slate-800 flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-terminal text-amber-500 text-xs"></i>
            <span class="text-xs font-mono font-bold text-white tracking-wider">WAREHOUSE AUDIT FEED</span>
          </div>
          <button id="clearLogBtn" class="text-[10px] font-mono text-slate-500 hover:text-slate-300">
            Clear
          </button>
        </div>

        <!-- Terminal Body -->
        <div class="p-3 flex-1 overflow-y-auto space-y-2 font-mono text-[11px]" id="terminalContainer">
          <!-- Injected dynamically -->
        </div>

        <!-- Terminal Status Bar -->
        <div class="bg-[#0b0f19] px-4 py-2 border-t border-slate-800 text-[10px] font-mono text-slate-500 flex justify-between">
          <span>REAL-TIME DISPATCH ENGINE</span>
          <span class="text-emerald-400">ACTIVE</span>
        </div>
      </div>
    </div>

  </main>

  <!-- Quick Dispatch / Restock Modal -->
  <div id="adjustModal" class="fixed inset-0 bg-black/70 backdrop-blur-xs z-50 flex items-center justify-center hidden p-4">
    <div class="bg-[#111827] border border-slate-700 rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden text-xs font-mono">
      <div id="adjustHeader" class="p-4 bg-amber-500 text-black flex justify-between items-center font-bold">
        <span id="adjustModalTitle">RESTOCK (STOCK IN)</span>
        <button id="closeAdjustBtn" class="text-black hover:opacity-70 text-base">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="adjustForm" class="p-5 space-y-3">
        <input type="hidden" id="adjustProdId">
        <input type="hidden" id="adjustType" value="IN">

        <div>
          <label class="block text-slate-400 text-[10px] mb-1">TARGET PRODUCT</label>
          <div id="adjustProdName" class="font-bold text-white text-xs truncate">Logitech Mouse</div>
        </div>

        <div>
          <label class="block text-slate-400 text-[10px] mb-1">QUANTITY UNITS</label>
          <input type="number" id="adjustQty" min="1" required value="10" class="w-full px-3 py-2 rounded-lg bg-[#0b0f19] border border-slate-700 text-white font-mono focus:outline-none focus:border-amber-500">
        </div>

        <div>
          <label class="block text-slate-400 text-[10px] mb-1">REFERENCE PO / ORDER NOTE</label>
          <input type="text" id="adjustNote" placeholder="PO-2026-99" class="w-full px-3 py-2 rounded-lg bg-[#0b0f19] border border-slate-700 text-white font-mono focus:outline-none focus:border-amber-500">
        </div>

        <div class="flex justify-end space-x-2 pt-3 border-t border-slate-800">
          <button type="button" id="cancelAdjustBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300">Cancel</button>
          <button type="submit" id="confirmAdjustBtn" class="px-4 py-1.5 rounded-lg bg-amber-500 text-black font-bold">Confirm</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Register SKU Modal -->
  <div id="skuModal" class="fixed inset-0 bg-black/70 backdrop-blur-xs z-50 flex items-center justify-center hidden p-4">
    <div class="bg-[#111827] border border-slate-700 rounded-2xl shadow-2xl max-w-md w-full overflow-hidden text-xs">
      <div class="p-4 bg-slate-900 border-b border-slate-800 text-white flex justify-between items-center font-mono font-bold">
        <span id="skuModalTitle">REGISTER NEW SKU RECORD</span>
        <button id="closeSkuBtn" class="text-slate-400 hover:text-white">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>

      <form id="skuForm" class="p-5 space-y-3 font-mono">
        <input type="hidden" id="skuHiddenId">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 text-[10px] mb-1">SKU CODE *</label>
            <input type="text" id="skuCode" required placeholder="SKU-TECH-001" class="w-full px-3 py-2 rounded-lg bg-[#0b0f19] border border-slate-700 text-white uppercase focus:border-amber-500">
          </div>
          <div>
            <label class="block text-slate-400 text-[10px] mb-1">CATEGORY *</label>
            <select id="skuCategory" required class="w-full px-3 py-2 rounded-lg bg-[#0b0f19] border border-slate-700 text-white">
              <option value="Electronics">Electronics</option>
              <option value="Computers & Accessories">Computers & Accessories</option>
              <option value="Networking">Networking</option>
              <option value="Office Supplies">Office Supplies</option>
              <option value="Audio & Video">Audio & Video</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-slate-400 text-[10px] mb-1">PRODUCT NAME *</label>
          <input type="text" id="skuName" required placeholder="Logitech MX Master 3S" class="w-full px-3 py-2 rounded-lg bg-[#0b0f19] border border-slate-700 text-white focus:border-amber-500 font-sans">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 text-[10px] mb-1">UNIT PRICE ($) *</label>
            <input type="number" id="skuPrice" step="0.01" min="0" required placeholder="99.99" class="w-full px-3 py-2 rounded-lg bg-[#0b0f19] border border-slate-700 text-white">
          </div>
          <div>
            <label class="block text-slate-400 text-[10px] mb-1">INITIAL QUANTITY *</label>
            <input type="number" id="skuQty" min="0" required placeholder="25" class="w-full px-3 py-2 rounded-lg bg-[#0b0f19] border border-slate-700 text-white">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 text-[10px] mb-1">REORDER THRESHOLD</label>
            <input type="number" id="skuThreshold" min="1" value="5" class="w-full px-3 py-2 rounded-lg bg-[#0b0f19] border border-slate-700 text-white">
          </div>
          <div>
            <label class="block text-slate-400 text-[10px] mb-1">SUPPLIER</label>
            <input type="text" id="skuSupplier" placeholder="Distributor Corp" class="w-full px-3 py-2 rounded-lg bg-[#0b0f19] border border-slate-700 text-white font-sans">
          </div>
        </div>

        <div class="flex justify-end space-x-2 pt-3 border-t border-slate-800">
          <button type="button" id="cancelSkuBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300">Cancel</button>
          <button type="submit" class="px-4 py-1.5 rounded-lg bg-amber-500 text-black font-bold">Save SKU</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

  <script src="app.js"></script>
</body>
</html>
